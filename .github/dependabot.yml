# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gomod" # See documentation for possible values
    directories:
      - "/"
      - "/core"
      - "/extension"
    schedule:
      interval: "daily"
    assignees:
      - "iyear"
    open-pull-requests-limit: 99
    ignore:
      # gotd/td is pinned by hand: core/storage strips stored dc keys and turns off the
      # peers cache to match v0.166.1's internals; recheck both before bumping
      - dependency-name: "github.com/gotd/td"
      - dependency-name: "github.com/gotd/contrib" # contrib bumps can raise gotd/td through minimum version selection
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "iyear"
    open-pull-requests-limit: 99
